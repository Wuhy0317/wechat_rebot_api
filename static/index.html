<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业微信机器人消息发送</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f1f3f4;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e8eaed;
        }

        .status {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 2px solid #c8e6c9;
            display: block;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #ffcdd2;
            display: block;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 2px solid #bbdefb;
            display: block;
        }

        .history {
            margin-top: 30px;
        }

        .history h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            padding: 15px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-item .time {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .history-item .content {
            color: #333;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>企业微信机器人消息发送</h1>
        
        <div class="status" id="status"></div>
        
        <div class="form-group">
            <label for="message">消息内容</label>
            <textarea id="message" placeholder="请输入要发送的消息..."></textarea>
        </div>
        
        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label for="webhookUrls">额外机器人地址（可选，多个地址用逗号分隔）</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="onlyUseExtraUrls" style="width: 18px; height: 18px;">
                    <label for="onlyUseExtraUrls" style="margin: 0; font-weight: normal;">仅发送到该机器人</label>
                </div>
            </div>
            <textarea id="webhookUrls" placeholder="例如：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=key1,https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=key2"></textarea>
        </div>
        
        <div class="btn-container">
            <button class="btn-primary" id="sendBtn">发送消息</button>
            <button class="btn-secondary" id="clearBtn">清空内容</button>
        </div>
        
        <div class="history">
            <h3>发送历史</h3>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('message');
        const webhookUrlsInput = document.getElementById('webhookUrls');
        const onlyUseExtraUrlsCheckbox = document.getElementById('onlyUseExtraUrls');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const historyList = document.getElementById('historyList');

        // 加载历史记录
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('wechatRobotHistory') || '[]');
            renderHistory(history);
        }

        // 渲染历史记录
        function renderHistory(history) {
            historyList.innerHTML = '';
            history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="time">${item.time}</div>
                    <div class="content">${item.content}</div>
                `;
                historyList.appendChild(historyItem);
            });
            // 滚动到底部
            historyList.scrollTop = historyList.scrollHeight;
        }

        // 添加历史记录
        function addHistory(content, success) {
            const history = JSON.parse(localStorage.getItem('wechatRobotHistory') || '[]');
            const now = new Date();
            const time = now.toLocaleString('zh-CN');
            history.push({
                content,
                time,
                success
            });
            // 只保留最近20条记录
            if (history.length > 20) {
                history.shift();
            }
            localStorage.setItem('wechatRobotHistory', JSON.stringify(history));
            renderHistory(history);
        }

        // 显示状态
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        // 发送消息
        async function sendMessage() {
            const content = messageInput.value.trim();
            const webhookUrls = webhookUrlsInput.value.trim();
            const onlyUseExtraUrls = onlyUseExtraUrlsCheckbox.checked;
            
            if (!content) {
                showStatus('请输入消息内容', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';
            showStatus('正在发送消息...', 'info');

            try {
                const response = await fetch('/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        content, 
                        webhook_urls: webhookUrls,
                        only_use_extra_urls: onlyUseExtraUrls
                    }),
                });

                const result = await response.json();
                
                if (result.success) {
                    showStatus(result.message, 'success');
                    addHistory(content, true);
                    // 发送成功后不清空输入框内容
                    onlyUseExtraUrlsCheckbox.checked = false;
                } else {
                    showStatus(result.message, 'error');
                    addHistory(content, false);
                }
            } catch (error) {
                showStatus(`发送失败：${error.message}`, 'error');
                addHistory(content, false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送消息';
            }
        }

        // 清空内容
        function clearContent() {
            messageInput.value = '';
            webhookUrlsInput.value = '';
            onlyUseExtraUrlsCheckbox.checked = false;
            status.style.display = 'none';
            messageInput.focus();
        }

        // 事件监听
        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', clearContent);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendMessage();
            }
        });

        // 初始化
        loadHistory();
        messageInput.focus();
    </script>
</body>
</html>
